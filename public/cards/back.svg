<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 525" width="300" height="525" role="img" aria-label="Tarot card back">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1b1640" />
      <stop offset="55%" stop-color="#100d2b" />
      <stop offset="100%" stop-color="#070617" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e7b0" />
      <stop offset="45%" stop-color="#cda349" />
      <stop offset="100%" stop-color="#8a6b21" />
    </linearGradient>
    <pattern id="stars" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <circle cx="8" cy="12" r="0.9" fill="#d8c98f" opacity="0.5" />
      <circle cx="42" cy="30" r="0.6" fill="#d8c98f" opacity="0.35" />
      <circle cx="22" cy="48" r="0.7" fill="#d8c98f" opacity="0.4" />
      <circle cx="54" cy="8" r="0.5" fill="#d8c98f" opacity="0.3" />
    </pattern>
  </defs>

  <rect width="300" height="525" rx="18" fill="url(#bg)" />
  <rect width="300" height="525" rx="18" fill="url(#stars)" />

  <!-- ornate border -->
  <rect x="12" y="12" width="276" height="501" rx="10" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.85" />
  <rect x="20" y="20" width="260" height="485" rx="6" fill="none" stroke="url(#gold)" stroke-width="0.7" opacity="0.55" />

  <g transform="translate(150 262)" stroke="url(#gold)" fill="none" stroke-width="1.3">
    <!-- radiant sun-moon emblem -->
    <g opacity="0.95">
      <circle r="58" stroke-width="1.6" />
      <circle r="40" stroke-width="0.8" opacity="0.7" />
      <!-- crescent embracing a star -->
      <path d="M 0 -30 A 30 30 0 1 0 22 26 A 38 38 0 1 1 0 -30 Z" fill="url(#gold)" stroke="none" opacity="0.9" />
      <path d="M0 -16 L3.6 -5 L15 -5 L5.7 1.8 L9.2 13 L0 6 L-9.2 13 L-5.7 1.8 L-15 -5 L-3.6 -5 Z"
            fill="url(#gold)" stroke="none" opacity="0.95" />
    </g>
    <!-- rays -->
    <g stroke-width="1.1" opacity="0.85">
      <line x1="0" y1="-70" x2="0" y2="-86" />
      <line x1="0" y1="70" x2="0" y2="86" />
      <line x1="-70" y1="0" x2="-86" y2="0" />
      <line x1="70" y1="0" x2="86" y2="0" />
      <line x1="-50" y1="-50" x2="-61" y2="-61" />
      <line x1="50" y1="-50" x2="61" y2="-61" />
      <line x1="-50" y1="50" x2="-61" y2="61" />
      <line x1="50" y1="50" x2="61" y2="61" />
    </g>
  </g>

  <!-- corner flourishes -->
  <g stroke="url(#gold)" fill="none" stroke-width="1" opacity="0.7">
    <path d="M34 34 q22 0 22 22" />
    <path d="M266 34 q-22 0 -22 22" />
    <path d="M34 491 q22 0 22 -22" />
    <path d="M266 491 q-22 0 -22 -22" />
  </g>
</svg>
